name: Bug report
description: A score, a crash or an output that looks wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Pronunciada version, placeholder: "output of: pronunciada --version"}
    validations: {required: true}
  - type: input
    id: lang
    attributes: {label: Language, placeholder: "en, zh, ja, es, fr, de, it, pt, ru or ko"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The expected text, the command or code you ran, and the output. Attach a short recording if you are allowed to share it.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
  - type: input
    id: env
    attributes: {label: Platform, placeholder: "macOS 15 arm64, Python 3.12"}
