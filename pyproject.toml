[project]
name = "pronunciada"
version = "0.1.0"
description = "On-device multilingual pronunciation scoring built on ZIPA phone-recognition models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "onnxruntime", "kaldi-native-fbank", "soundfile", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "huggingface_hub"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pronunciada*"]

[tool.setuptools.package-data]
pronunciada = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
